<!DOCTYPE html>
<html lang="en">
<head>
  <script src="analytics.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ozgur Stars — Places Worth Traveling Back For</title>
  <link rel="canonical" href="https://ozguralp.com/travel/ozgur-stars.html" />
  <meta name="description" content="Ozgur Stars: a personal map of restaurants, hotels, cafes and experiences worth making another trip for." />
  <meta name="author" content="Özgür Alp" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Ozgur Stars — Özgür Alp" />
  <meta property="og:description" content="A personal shortlist of places worth making another trip for." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ozguralp.com/travel/ozgur-stars.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="stars">
  <div class="top-bar">
    <a href="https://ozguralp.com" class="back-link">&larr; ozguralp.com</a>
    <nav class="top-actions" aria-label="Travel sections">
      <a class="toggle-btn" href="./">List</a>
      <details class="nav-menu">
        <summary class="toggle-btn active" aria-current="page">Maps</summary>
        <div class="nav-menu-content">
          <a href="map.html">Travel Map</a>
          <a href="places.html">Place Reviews</a>
          <a href="ozgur-stars.html" aria-current="page">Ozgur Stars</a>
        </div>
      </details>
      <a class="toggle-btn" href="timeline.html">Timeline</a>
      <button class="toggle-btn" id="themeToggle" type="button" onclick="toggleTheme()">Dark</button>
    </nav>
  </div>

  <header>
    <h1>Ozgur Stars</h1>
    <p class="tagline">The places I would make another trip for</p>
    <p class="tagline-sub">a personal shortlist by <a href="https://ozguralp.com">Özgür Alp</a></p>
    <hr class="header-divider" />
  </header>

  <main class="map-page">
    <div class="place-summary" id="starSummary" aria-live="polite"></div>
    <div class="category-shortcuts stars-filter-shortcuts" id="starCategoryShortcuts" aria-label="Ozgur Stars categories">
      <button type="button" data-category="all" class="active">All <span data-star-category-count="all"></span></button>
      <button type="button" data-category="restaurant">Restaurants <span data-star-category-count="restaurant"></span></button>
      <button type="button" data-category="hotel">Hotels <span data-star-category-count="hotel"></span></button>
      <button type="button" data-category="cafe">Cafes <span data-star-category-count="cafe"></span></button>
      <button type="button" data-category="bar">Bars <span data-star-category-count="bar"></span></button>
    </div>
    <form class="place-filters stars-filters" id="starFilters" onsubmit="return false">
      <label>Search
        <input type="search" id="starSearch" placeholder="Place, personal note or address" />
      </label>
      <label>Category
        <select id="starCategory">
          <option value="all">All categories</option>
          <option value="restaurant">Restaurants</option>
          <option value="cafe">Cafes</option>
          <option value="bar">Bars</option>
          <option value="hotel">Hotels</option>
          <option value="attraction">Attractions</option>
          <option value="tour">Tours</option>
          <option value="transport">Transport</option>
        </select>
      </label>
      <label>Country
        <select id="starCountry"><option value="all">All countries</option></select>
      </label>
      <button type="button" class="filter-reset" id="resetStarFilters">Reset</button>
    </form>
    <div id="starsMap" aria-label="Map of Ozgur Stars"></div>
    <div class="stars-list" id="starsList"></div>
  </main>

  <footer><p>&copy; 2026 Özgür Alp</p></footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
