e selections for glass were also ok. Definitely worth to try.","date":"","category":"restaurant","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.709834,"lng":-9.132953,"name":"Lisbon Cathedral","address":"Largo da Sé 1, 1100-585 Lisboa, Portugal","rating":4,"text":"A nice one to see when passing by","date":"2023","category":"attraction","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.713909,"lng":-9.133476,"name":"Castelo de São Jorge","address":"R. de Santa Cruz do Castelo, 1100-129 Lisboa, Portugal","rating":5,"text":"Just an amazing place. A must see. We watched sunset in here and the view was awesome.","date":"2023","category":"attraction","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.712038,"lng":-9.140613,"name":"Carmo Archaeological Museum","address":"Largo do Carmo, 1200-092 Lisboa, Portugal","rating":4,"text":"A really unique place to see. Also museum is nice. Price is 5 eur which is ok comparing to the what they have inside.","date":"","category":"attraction","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.710228,"lng":-9.137428,"name":"Casa Portuguesa do Pastel de Bacalhau","address":"R. Augusta 106, 1100-053 Lisboa, Portugal","rating":4,"text":"A really different taste to experience. Personally it is not my style but still the presentation is really nice.","date":"","category":"hotel","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.713442,"lng":-9.140696,"name":"Ginginha do Carmo","address":"Calçada do Carmo 37 A, 1200-090 Lisboa, Portugal","rating":5,"text":"Awesome place to taste Ginginha! Serving lady was also super nice.","date":"","category":"attraction","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.708445,"lng":-9.136824,"name":"Rua Augusta Arch","address":"R. Augusta 2, 1100-053 Lisboa, Portugal","rating":5,"text":"Just an amazing place to see.","date":"","category":"attraction","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.708215,"lng":-9.136727,"name":"Praça do Comércio","address":"1100-148 Lisbon, Portugal","rating":5,"text":"","date":"2023","category":"attraction","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.706735,"lng":-9.145945,"name":"Garrafeira Nacional","address":"Av. 24 de Julho 49, 1200-161 Lisboa, Portugal","rating":5,"text":"We came here by just chance but actually had a chance to taste a 1878 port wine. Amazing!! Super recommending to check it out to everyone visiting.","date":"2023","category":"shop","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.706756,"lng":-9.145821,"name":"Manteigaria","address":"Av. 24 de Julho 50, 1200-109 Lisboa, Portugal","rating":4,"text":"Nice natas!!","date":"2023","category":"shop","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.711712,"lng":-9.143775,"name":"Limoncello","address":"R. do Norte 61, 1200-284 Lisboa, Portugal","rating":4,"text":"Good food. I had a limoncello salad and it was really both delicious and also satisfying.","date":"","category":"restaurant","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.69751,"lng":-9.203228,"name":"Pastéis de Belém","address":"R. de Belém 84 92, 1300-085 Lisboa, Portugal","rating":5,"text":"Had some quite fews nata on the both Lisbon and Porto and this place does actually the best all over! An essential must to have in Lisbon.","date":"2023","category":"shop","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.693597,"lng":-9.205711,"name":"Monument to the Discoveries","address":"Av. Brasília, 1400-038 Lisboa, Portugal","rating":5,"text":"Just an amazing monument!","date":"","category":"attraction","blog_slugs":["lisbon"],"color":"#16a34a"},{"lat":38.722252,"lng":-9.139337,"name":"Taguscruises Boat Tours & Yacht Charter","address":"Doca do Bom Sucesso, Avenida de Brasília, 1400-038 Lisboa, Portugal","rating":4,"text":"Tour was really nice however the guys that took our group to the tour were a little bit too talky and had some intense jokes","date":"","category":"tour","blog_slugs":["lisbon"],"color":"#65a30d"},{"lat":38.69287,"lng":-9.215892,"name":"Belém
