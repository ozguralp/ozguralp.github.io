    var postData=[{"lat":13.7563,"lng":100.5018,"title":"Bangkok","slug":"bangkok"},{"lat":15.87,"lng":100.99,"title":"Thailand","slug":"thailand"},{"lat":9.512,"lng":100.0136,"title":"Koh Samui","slug":"koh-samui"}];
    var revData=[{"lat":13.7373633,"lng":100.5431568,"name":"KURA Premium Yakiniku and Sushi 蔵","address":"Room no VELAA AT SINDHORN VILLAGE B104, 87 105 Soi Langsuan, Lumphini, Pathum Wan, Bangkok 10330, Thailand","rating":4,"text":"The sushi was good, liked the eel and salad sushi the most. The salads were also good. The chicken thigh and edamame were good too. We liked it overall. The staff are very attentive.","date":"Apr 2026","category":"restaurant","blog_slugs":["bangkok"],"color":"#65a30d"},{"lat":13.7447256,"lng":100.5295802,"name":"Sizzler MBK","address":"SIam Tower ชั้น 7 444 Phaya Thai Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand","rating":5,"text":"Same level as Centralworld, this one is good too.","date":"Apr 2026","category":"restaurant","blog_slugs":["bangkok"],"color":"#16a34a"},{"lat":13.7455928,"lng":100.5298477,"name":"DON DON DONKI MBK Center","address":"444 Phaya Thai Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand","rating":3,"text":"Didn't see what all the fuss was about, on the contrary it was very chaotic inside.","date":"Apr 2026","category":"shop","blog_slugs":["bangkok"],"color":"#ca8a04"},{"lat":13.7465176,"lng":100.539691,"name":"Kyo Roll En","address":"CentralWorld, 3F Pathum Wan, Bangkok 10330, Thailand","rating":4,"text":"We tried the organic chocolate, kinako, and yuzu miso mochi. Apart from the chocolate, the rest were bad.","date":"Apr 2026","category":"restaurant","blog_slugs":["bangkok"],"color":"#65a30d"},{"lat":13.7468278,"lng":100.5398846,"name":"Sizzler centralwOrld","address":"4/1-2 ศูนย์การค้าเซ็นทรัลเวิลด์ Ratchadamri Rd, Pathum Wan, Bangkok 10330, Thailand","rating":5,"text":"Edamame, Japanese pumpkin, pickles, and baby corn were my favorites. An unlimited salad bar for 200 baht is truly incredible. Their toast also tastes amazing. The dynamite prawn is the same as the Crazy Shrimp at Hard Rock Bangkok, and that is no coincidence.","date":"Apr 2026","category":"restaurant","blog_slugs":["bangkok"],"color":"#16a34a"},{"lat":13.7433304,"lng":100.5406026,"name":"Grand Hyatt Erawan Bangkok","address":"494 Ratchadamri Rd, Khwaeng Lumphini, Pathum Wan, Krung Thep Maha Nakhon 10330, Thailand","rating":5,"text":"A noisy hotel, the rooms have a slightly odd style. The breakfast is incredibly detailed: döner, sushi, cheese, hummus and many options. Desserts, salad bar, everything was excellent. There was even pastel de nata. The hotel is freezing cold, the room was also cold even though the AC wasn't running.","date":"Apr 2026","category":"hotel","blog_slugs":["bangkok"],"color":"#16a34a"},{"lat":9.5617181,"lng":100.0258194,"name":"H Bistro","address":"H26G+M8P, Tambon Bo Put, Ko Samui District, Surat Thani 84320, Thailand","rating":4,"text":"This place and its neighbors have live music right next to Fisherman's Village. It is a good option for a calmer atmosphere.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#65a30d"},{"lat":9.5591769,"lng":100.0315569,"name":"The Thai Tapas","address":"29, Bo Put, Amphoe Ko Samui, Surat Thani 84320, Thailand","rating":4,"text":"It seems to be run as a foreign and Thai partnership. All the dishes were good. None was a masterpiece, but each had a different touch. The shrimp cake and duck à l'orange were our favorites.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#65a30d"},{"lat":9.5610677,"lng":100.0276704,"name":"Coco Tam’s","address":"62 Thesaban Nakhon Ko Samui, Ko Samui District, Surat Thani 84320, Thailand","rating":5,"text":"Great ambiance and a buzzing atmosphere. There is no direct beach access from here, but the two neighboring venues, Coco Tam's Beach and Summer, are extensions of it and have nearly identical menus. We sat at Summer and liked it. There is a fire show every evening, and it is quite good. If you have not seen one elsewhere, you can watch it here.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.5599615,"lng":100.0304629,"name":"Bacaba Samui บาคาบา สมุย","address":"65, 51/8 fisherman village หมู่ 1 ต.บ่อผุด 1 บ่อผุด Ko Samui District, Surat Thani 84320, Thailand","rating":4,"text":"Good wine by the glass selection, nice ambiance.","date":"Apr 2026","category":"bar","blog_slugs":["koh-samui"],"color":"#65a30d"},{"lat":9.5605841,"lng":100.0283669,"name":"Salt & Oak","address":"24/36, Bo Put, Amphoe Koh samui, koh samui, Surat Thani 84320, Thailand","rating":5,"text":"The lobster and shark were great. Nice venue.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.5613279,"lng":100.0231918,"name":"Bo Phut Resort","address":"หมู่ที่ 1 12/12 ตำบล บ่อผุด Ko Samui District, Surat Thani 84320, Thailand","rating":5,"text":"A great hotel, definitely worth splurging and staying somewhere of this level. The difference amplifies the quality by 10x. The rooms are very large, the beach is great, the staff are very attentive. They gave a free room upgrade from garden to pool. They gave Nil a free teddy bear. The breakfast is also excellent, the content is very good.","date":"Apr 2026","category":"hotel","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.4678542,"lng":100.0474225,"name":"ANNIE eatery & sweetery - Lamai","address":"124 Had Lamai Rd, Tambon Maret, Ko Samui District, Surat Thani 84310, Thailand","rating":5,"text":"A nice restaurant, especially if you want something healthy such as a bowl, although there is less reason to choose that when the island has so many good seafood options. The desserts are amazing: we tried the chocolate truffle and Snickers desserts, and both were excellent.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.4808845,"lng":100.0666644,"name":"The Cliff Bar and Grill","address":"124/2 Maret, Suratthani, Surat Thani 84310, Thailand","rating":4,"text":"A very nice restaurant. Most of the food is organic, the menu leans Western, and the wine list is extensive. It was, however, expensive compared with the other restaurants we visited. Prices exclude VAT and there is also a 10% service charge. We paid 3,400 baht here, compared with 1,700 baht at a Michelin-recommended Thai restaurant.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#65a30d"},{"lat":9.5117149,"lng":100.0549702,"name":"Phensiri Thai Restaurant","address":"80/30 ถนน เลียบหาดเฉวง, Ko Samui District, Surat Thani 84320, Thailand","rating":5,"text":"Definitely make a reservation. It was very crowded; we arrived early and could only get a table for one hour. Every dish we tried was very good, and you can safely ask the staff for recommendations.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.5108134,"lng":100.0517424,"name":"Chill Inn Co Working","address":"147, 23 Moo3, Bo Put, Amphoe Ko Samui, Surat Thani 84320, Thailand","rating":4,"text":"A nice space for working, the teas are also very good.","date":"Apr 2026","category":"bar","blog_slugs":["koh-samui"],"color":"#65a30d"},{"lat":9.4659285,"lng":100.0447953,"name":"Seventy Fahrenheit","address":"124, 314 Had Lamai Rd, Maret, Ko Samui District, Surat Thani 84310, Thailand","rating":5,"text":"A great place to eat. We were happy with everything we had. The tom yum talay and steam seabass were great.","date":"Apr 2026","category":"restaurant","blog_slugs":["koh-samui"],"color":"#16a34a"},{"lat":9.4680159,"lng":100.0480056,"name":"Pavilion Samui Villas & Resort","address":"124 Had Lamai Rd, Tambon Maret, Amphoe Ko Samui, Surat Thani 84310, Thailand","rating":1,"text":"For the price, I didn't like it at all. The hotel is old, not worth this price in my opinion. The fire show was good. The beach isn't bad, the sandy area is enjoyable. Cheap hotel vibes. We took the baby to breakfast and when we went a second time for coffee they made a fuss, apparently it's their policy. Typical cheap hotel behavior. The hotel smells completely of cigarettes and weed. You can smell what the person in the next room is smoking in your room. Zero insulation, we slept with cigarette smoke in the room. We complained but they didn't intervene, said they couldn't smell anything. Bad hotel.","date":"Apr 2026","category":"hotel","blog_slugs":["koh-samui"],"color":"#dc2626"},{"lat":9.5607441,"lng":100.0223241,"name":"The Jane","address":"H26C+9R9, Bo Put, Ko Samui District, Surat Thani 84320, Thailand","rating":4,"text":"They gave a good foot massage, and the setting was casual.","date":"Apr 2026","category":"attraction","blog_slugs":["koh-samui"],"color":"#65a30d"}];
